[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classica-x"
version = "1.1.1"
description = "Aplicação local para downloads autorizados de publicações públicas do X"
requires-python = ">=3.11"
dependencies = ["yt-dlp==2025.1.15"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
build = ["build==1.2.2.post1"]
windows = ["pyinstaller==6.16.0"]

[project.scripts]
classica-x = "classica_x.app:main"

[tool.setuptools]
packages = ["classica_x"]

[tool.setuptools.package-data]
classica_x = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires yt-dlp and FFmpeg"]
