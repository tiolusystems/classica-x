name: quality

on:
  push:
    branches: ["dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q classica_x tests
      - name: Unit tests
        run: python -m pytest -q
  package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install ".[build]"
      - run: python -m build
