name: quality

on:
  push:
    branches: ["dev/**", main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Install FFmpeg for integration tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg for integration tests
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Compile
        run: python -m compileall -q classica_x tests
      - name: Unit tests
        run: python -m pytest -q
  package:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install ".[build]"
      - run: python -m build
  windows-package:
    name: Package Windows x64 independently
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip && python -m pip install ".[windows]"
      - run: choco install ffmpeg -y --no-progress
      - shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicaX-Windows-x64
          path: dist/ClassicaX

  release:
    name: Publish official Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, package, windows-package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClassicaX-Windows-x64
          path: stage/ClassicaX-1.1.0
      - name: Pack independently, checksum and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd stage
          zip -q -r "../dist/ClassicaX-1.1.0-Windows-x64.zip" "ClassicaX-1.1.0"
          cd ..
          cd dist
          sha256sum "ClassicaX-1.1.0-Windows-x64.zip" > "ClassicaX-1.1.0-Windows-x64.zip.sha256"
          sha256sum -c "ClassicaX-1.1.0-Windows-x64.zip.sha256"
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.0 already exists; release remains immutable."
            exit 0
          fi
          gh release create v1.1.0 "ClassicaX-1.1.0-Windows-x64.zip" "ClassicaX-1.1.0-Windows-x64.zip.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ClassicaX 1.1.0" --notes "Versão Windows x64 independente, sem assinatura digital. Instale apenas conteúdos autorizados."
